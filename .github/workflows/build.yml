name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "Secret GOOGLE_SERVICES_JSON is empty"; exit 1; fi
          if printf '%s' "$GSJ" | head -c1 | grep -q '{'; then
            printf '%s' "$GSJ" > app/google-services.json
          else
            printf '%s' "$GSJ" | base64 -d > app/google-services.json
          fi
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WatchEarn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
